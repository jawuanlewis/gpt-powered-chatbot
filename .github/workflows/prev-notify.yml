name: Preview Deployment Notification

on:
  deployment_status:

jobs:
  notify-slack:
    # Only run for successful preview deployments
    if: |
      github.event.deployment_status.state == 'success' && 
      github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - name: Extract deployment info
        id: deployment-info
        run: |
          echo "deployment_url=${{ secrets.VERCEL_PREVIEW_URL }}" >> $GITHUB_OUTPUT
          echo "commit_sha=$(echo '${{ github.event.deployment.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "commit_full_sha=${{ github.event.deployment.sha }}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.deployment_status.environment }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.event.deployment.creator.login }}" >> $GITHUB_OUTPUT

          # Get commit message from GitHub API since deployment event doesn't always include it
          COMMIT_MESSAGE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.deployment.sha }}" | \
            jq -r '.commit.message' | head -c 100)
          echo "commit_message=${COMMIT_MESSAGE}" >> $GITHUB_OUTPUT

      - name: Notify Slack on successful deployment
        run: |
          # Build the message text in a variable for better readability
          MESSAGE_TEXT="*Repository:* ${{ github.repository }}"
          MESSAGE_TEXT="${MESSAGE_TEXT}\n*Environment:* ${{ steps.deployment-info.outputs.environment }}"
          MESSAGE_TEXT="${MESSAGE_TEXT}\n*Author:* ${{ steps.deployment-info.outputs.author }}"
          MESSAGE_TEXT="${MESSAGE_TEXT}\n*Commit:* \`${{ steps.deployment-info.outputs.commit_sha }}\`"
          MESSAGE_TEXT="${MESSAGE_TEXT}\n*Message:* ${{ steps.deployment-info.outputs.commit_message }}"

          curl -X POST -H 'Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}' \
            -H 'Content-type: application/json' \
            --data "{
              \"channel\": \"#prev-deployments\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"🚀 Frontend Deployment Successful\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"${MESSAGE_TEXT}\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {
                        \"type\": \"plain_text\",
                        \"text\": \"View Deployment\"
                      },
                      \"url\": \"${{ secrets.VERCEL_PREVIEW_URL }}\",
                      \"style\": \"primary\"
                    },
                    {
                      \"type\": \"button\",
                      \"text\": {
                        \"type\": \"plain_text\",
                        \"text\": \"View Commit\"
                      },
                      \"url\": \"https://github.com/${{ github.repository }}/commit/${{ steps.deployment-info.outputs.commit_full_sha }}\"
                    }
                  ]
                }
              ]
            }" \
            https://slack.com/api/chat.postMessage

  notify-slack-failure:
    # Handle failed deployments
    if: |
      github.event.deployment_status.state == 'failure' && 
      github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - name: Extract deployment info
        id: deployment-info
        run: |
          echo "commit_sha=$(echo '${{ github.event.deployment.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "commit_full_sha=${{ github.event.deployment.sha }}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.deployment_status.environment }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.event.deployment.creator.login }}" >> $GITHUB_OUTPUT

      - name: Notify Slack on failed deployment
        run: |
          # Build the message text in a variable for better readability
          MESSAGE_TEXT="*Repository:* ${{ github.repository }}"
          MESSAGE_TEXT="${MESSAGE_TEXT}\n*Environment:* ${{ steps.deployment-info.outputs.environment }}"
          MESSAGE_TEXT="${MESSAGE_TEXT}\n*Author:* ${{ steps.deployment-info.outputs.author }}"
          MESSAGE_TEXT="${MESSAGE_TEXT}\n*Commit:* \`${{ steps.deployment-info.outputs.commit_sha }}\`"
          MESSAGE_TEXT="${MESSAGE_TEXT}\n\n❗ *Check your Vercel dashboard for error details.*"

          curl -X POST -H 'Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}' \
            -H 'Content-type: application/json' \
            --data "{
              \"channel\": \"#prev-deployments\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"⚠️ Frontend Deployment Failed\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"${MESSAGE_TEXT}\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {
                        \"type\": \"plain_text\",
                        \"text\": \"View Commit\"
                      },
                      \"url\": \"https://github.com/${{ github.repository }}/commit/${{ steps.deployment-info.outputs.commit_full_sha }}\"
                    },
                    {
                      \"type\": \"button\",
                      \"text\": {
                        \"type\": \"plain_text\",
                        \"text\": \"Vercel Dashboard\"
                      },
                      \"url\": \"https://vercel.com/dashboard\"
                    }
                  ]
                }
              ]
            }" \
            https://slack.com/api/chat.postMessage
