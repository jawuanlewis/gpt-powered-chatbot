name: Production Deployment Notification

on:
  deployment_status:

jobs:
  notify-slack:
    # Only run for successful production deployments
    if: |
      github.event.deployment_status.state == 'success' && 
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Extract deployment info
        id: deployment-info
        run: |
          echo "deployment_url=${{ github.event.deployment_status.target_url }}" >> $GITHUB_OUTPUT
          echo "commit_sha=$(echo '${{ github.event.deployment.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "commit_full_sha=${{ github.event.deployment.sha }}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.deployment_status.environment }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.event.deployment.creator.login }}" >> $GITHUB_OUTPUT

          # Get commit message from GitHub API since deployment event doesn't always include it
          COMMIT_MESSAGE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.deployment.sha }}" | \
            jq -r '.commit.message' | head -c 100)
          echo "commit_message=${COMMIT_MESSAGE}" >> $GITHUB_OUTPUT

      - name: Notify Slack on successful deployment
        run: |
          curl -X POST -H 'Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}' \
            -H 'Content-type: application/json' \
            --data '{
              "channel": "#prod-deployments",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Frontend Deployment Successful"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n" +
                      "*Environment:* ${{ steps.deployment-info.outputs.environment }}\n" +
                      "*Author:* ${{ steps.deployment-info.outputs.author }}\n" +
                      "*Commit:* `${{ steps.deployment-info.outputs.commit_sha }}`\n" +
                      "*Message:* ${{ steps.deployment-info.outputs.commit_message }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Deployment"
                      },
                      "url": "${{ steps.deployment-info.outputs.deployment_url }}",
                      "style": "primary"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Commit"
                      },
                      "url": "https://github.com/${{ github.repository }}/commit/${{ steps.deployment-info.outputs.commit_full_sha }}"
                    }
                  ]
                }
              ]
            }' \
            https://slack.com/api/chat.postMessage

  notify-slack-failure:
    # Handle failed deployments
    if: |
      github.event.deployment_status.state == 'failure' && 
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Extract deployment info
        id: deployment-info
        run: |
          echo "commit_sha=$(echo '${{ github.event.deployment.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "commit_full_sha=${{ github.event.deployment.sha }}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.deployment_status.environment }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.event.deployment.creator.login }}" >> $GITHUB_OUTPUT

      - name: Notify Slack on failed deployment
        run: |
          curl -X POST -H 'Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}' \
            -H 'Content-type: application/json' \
            --data '{
              "channel": "#prod-deployments",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "⚠️ Frontend Deployment Failed"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n" +
                      "*Environment:* ${{ steps.deployment-info.outputs.environment }}\n" +
                      "*Author:* ${{ steps.deployment-info.outputs.author }}\n" +
                      "*Commit:* `${{ steps.deployment-info.outputs.commit_sha }}`\n\n" +
                      "❗ *Check your Vercel dashboard for error details.*"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Commit"
                      },
                      "url": "https://github.com/${{ github.repository }}/commit/${{ steps.deployment-info.outputs.commit_full_sha }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Vercel Dashboard"
                      },
                      "url": "https://vercel.com/dashboard"
                    }
                  ]
                }
              ]
            }' \
            https://slack.com/api/chat.postMessage
